
name: orchestrix-veritas

services:
  orchestrix-veritas-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: orchestrix-veritas-api:latest
    container_name: orchestrix-veritas-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    command: uvicorn orchestrix_veritas.api.main:app --host 0.0.0.0 --port 8000
